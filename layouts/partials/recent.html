{{ $news := .Site.Data.news.news | default slice }}

<div class="divide-y divide-slate-300 rounded-[1.25rem] border border-slate-300 bg-white">
  {{ range first 3 $news }}
  <article class="p-6">
    <div class="flex flex-col gap-2 md:flex-row md:items-start md:justify-between">
      <div>
        <h3 class="text-lg font-semibold text-slate-950">{{ .title }}</h3>
        {{ with .summary }}
        <p class="mt-2 text-sm leading-6 text-slate-600">{{ . }}</p>
        {{ end }}
      </div>
      {{ with .date }}
      <time class="shrink-0 text-sm font-semibold text-slate-500">{{ . }}</time>
      {{ end }}
    </div>
    {{ with .link }}
    <div class="mt-3">
      <a href="{{ . }}" class="inline-flex items-center text-sm font-semibold text-blue-700 hover:text-blue-900">Read more</a>
    </div>
    {{ end }}
  </article>
  {{ end }}
</div>

<div class="mt-8 flex flex-wrap justify-center">
    <a href="/news/"
        class="inline-flex items-center justify-center gap-2 rounded-full border border-slate-200 bg-white px-6 py-3 text-sm font-semibold text-slate-950 transition hover:-translate-y-0.5 hover:border-slate-300">
        All Posts <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-right" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"/>
        </svg>
    </a>
</div>
