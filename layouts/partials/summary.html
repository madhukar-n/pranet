<article class="summary-card overflow-hidden">
  <div class="grid lg:grid-cols-[18rem,1fr]">
    <div class="relative min-h-56 overflow-hidden border-b border-slate-200 bg-slate-50 lg:border-b-0 lg:border-r">
      {{ if .Params.image }}
      <img id="thumb" alt="{{ .Title }}" class="h-full w-full object-cover transition duration-300 group-hover:scale-[1.01]"
        src="{{ .Params.image | relURL }}" />
      {{ else }}
      <img id="thumb" alt="{{ .Title }}" class="h-full w-full object-cover transition duration-300 group-hover:scale-[1.01]"
        src='{{ "img/default.jpg" | relURL }}'>
      {{ end }}
    </div>
    <div class="flex flex-col justify-between gap-5 p-6 md:p-8">
      <div>
        <h3 class="text-2xl font-semibold tracking-tight text-slate-950 md:text-3xl">{{ .Title }}</h3>
        <p class="mt-3 max-w-3xl text-base leading-7 text-slate-600">{{ substr .Summary 0 150 | plainify | htmlUnescape }}...</p>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <p class="section-meta w-fit">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z"/>
            <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m7-8A7 7 0 1 1 1 8a7 7 0 0 1 14 0"/>
          </svg>
          <time>{{ .Date.Format "2006/01/02" }}</time>
        </p>
        <span class="card-chip">Read more</span>
      </div>
    </div>
  </div>
</article>
