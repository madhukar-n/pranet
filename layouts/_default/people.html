{{ define "main" }}
<div class="mx-auto mt-6 mb-10 max-w-7xl px-4 sm:px-6 lg:px-8">
  <article class="px-6 py-6 md:px-10 md:py-10">
    <h1 class="section-title mt-2 text-center text-4xl md:text-5xl">{{ .Title }}</h1>
    <div class="content prose prose-lg mt-5 max-w-none">
      {{ .Content }}
    </div>
    <div class="people-list mt-8">
      {{ partial "people-grid.html" . }}
    </div>
  </article>
</div>
{{ end }}
